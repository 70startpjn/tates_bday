<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Knows Tate Best?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0d1f;
    --paper: #fdf6e8;
    --ink: #2a1810;
    --pink: #ff4d8d;
    --gold: #ffc94d;
    --teal: #4dd4c4;
    --purple: #a855f7;
    --red: #ff5757;
    --green: #4ade80;
    --opt-a: #e63946;
    --opt-b: #2563eb;
    --opt-c: #f59e0b;
    --opt-d: #16a34a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 10%, #ff4d8d33 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, #a855f733 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #ffc94d11 0%, transparent 70%);
    color: var(--paper);
    font-family: 'Fraunces', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-sparkle {
    position: fixed;
    pointer-events: none;
    opacity: 0.4;
    font-size: 24px;
    animation: float 8s ease-in-out infinite;
  }
  .bg-sparkle:nth-child(1) { top: 10%; left: 5%; color: var(--gold); animation-delay: 0s; }
  .bg-sparkle:nth-child(2) { top: 25%; right: 8%; color: var(--pink); animation-delay: 1s; }
  .bg-sparkle:nth-child(3) { top: 60%; left: 10%; color: var(--teal); animation-delay: 2s; }
  .bg-sparkle:nth-child(4) { top: 75%; right: 5%; color: var(--purple); animation-delay: 3s; }
  .bg-sparkle:nth-child(5) { top: 40%; left: 50%; color: var(--gold); animation-delay: 4s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(180deg); }
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    position: relative;
    z-index: 1;
  }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.4s ease-out; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .start-screen { text-align: center; padding-top: 40px; }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }
  .eyebrow::before, .eyebrow::after {
    content: '✦';
    margin: 0 10px;
    color: var(--pink);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(56px, 11vw, 110px);
    line-height: 0.92;
    letter-spacing: -0.03em;
  }
  h1 .highlight {
    color: var(--pink);
    font-style: normal;
    display: inline-block;
    transform: rotate(-3deg);
    text-shadow: 5px 5px 0 var(--gold);
  }
  h1 .highlight2 {
    color: var(--gold);
    font-style: normal;
    display: inline-block;
    transform: rotate(2deg);
    text-shadow: 5px 5px 0 var(--pink);
  }

  .subtitle {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    margin: 20px 0 36px;
    color: var(--paper);
    opacity: 0.9;
  }

  .name-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 460px;
    margin: 0 auto;
    box-shadow: 0 0 0 4px var(--ink), 8px 8px 0 var(--pink), 16px 16px 0 var(--gold);
    text-align: left;
  }

  .name-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.6;
  }

  .name-input-big {
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 32px;
    font-weight: 700;
    color: var(--ink);
    outline: none;
    border-bottom: 3px solid var(--ink);
    padding: 4px 0 8px;
  }
  .name-input-big::placeholder { color: #2a181066; }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 500;
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 14px 24px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--paper);
    color: var(--ink);
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active { transform: translate(0,0); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-big {
    font-size: 18px;
    padding: 18px 36px;
    background: var(--pink);
    color: var(--paper);
    margin-top: 24px;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .player-tag {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--gold);
  }

  .progress-info {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .progress-bar {
    height: 8px;
    background: #ffffff22;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--gold));
    transition: width 0.4s ease-out;
  }

  .question-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 24px;
    padding: 32px 28px;
    margin-bottom: 24px;
    box-shadow: 0 0 0 4px var(--ink), 8px 8px 0 var(--pink);
    text-align: center;
  }

  .question-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--pink);
    margin-bottom: 12px;
  }

  .question-text {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 900;
    font-size: clamp(24px, 4vw, 32px);
    line-height: 1.2;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .options-grid.tf { max-width: 600px; margin: 0 auto; }

  .option-btn {
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 22px 18px;
    cursor: pointer;
    text-align: left;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--paper);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 80px;
    word-break: break-word;
  }

  .option-btn:hover:not(:disabled) {
    transform: translate(-3px, -3px);
    box-shadow: 6px 6px 0 var(--ink);
  }
  .option-btn:disabled { cursor: not-allowed; }

  .option-btn .icon {
    font-size: 24px;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.25);
    border-radius: 8px;
    border: 2px solid var(--paper);
  }

  .option-btn[data-color="a"] { background: var(--opt-a); }
  .option-btn[data-color="b"] { background: var(--opt-b); }
  .option-btn[data-color="c"] { background: var(--opt-c); }
  .option-btn[data-color="d"] { background: var(--opt-d); }

  .option-btn.correct {
    background: var(--green) !important;
    transform: scale(1.02);
    box-shadow: 0 0 0 4px var(--gold);
  }
  .option-btn.wrong {
    background: #6b6b6b !important;
    opacity: 0.6;
  }
  .option-btn.selected-wrong {
    background: var(--red) !important;
    box-shadow: 0 0 0 4px var(--ink);
  }

  .options-grid.tf .option-btn {
    justify-content: center;
    text-align: center;
    font-size: 28px;
    min-height: 110px;
    font-style: italic;
  }
  .options-grid.tf .option-btn .icon { display: none; }

  .feedback {
    text-align: center;
    margin: 20px 0;
    min-height: 40px;
  }
  .feedback-text {
    font-family: 'Caveat', cursive;
    font-size: 32px;
    animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .feedback-text.right { color: var(--green); }
  .feedback-text.wrong { color: var(--red); }

  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .next-btn {
    display: block;
    margin: 16px auto 0;
    background: var(--gold);
    border-color: var(--ink);
  }

  .winner-eyebrow {
    font-family: 'Caveat', cursive;
    font-size: 32px;
    color: var(--gold);
    margin-bottom: 8px;
    transform: rotate(-2deg);
    display: inline-block;
    text-align: center;
    width: 100%;
  }

  .final-score-card {
    text-align: center;
    margin-bottom: 32px;
  }

  .you-got {
    font-family: 'Caveat', cursive;
    font-size: 30px;
    color: var(--paper);
    opacity: 0.9;
  }

  .big-score {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 900;
    font-size: clamp(80px, 18vw, 180px);
    line-height: 0.95;
    color: var(--paper);
    text-shadow: 5px 5px 0 var(--pink), 10px 10px 0 var(--purple);
    margin: 8px 0;
  }
  .big-score .total {
    color: var(--gold);
    font-size: 0.5em;
    opacity: 0.8;
  }

  .verdict {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 900;
    font-size: clamp(28px, 5vw, 40px);
    color: var(--gold);
    margin: 16px 0 24px;
  }

  .leaderboard {
    background: var(--paper);
    color: var(--ink);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 0 0 4px var(--ink), 8px 8px 0 var(--gold);
    margin-bottom: 24px;
  }

  .leaderboard-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 900;
    font-size: 24px;
    text-align: center;
    margin-bottom: 4px;
  }

  .leaderboard-sub {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 20px;
  }

  .leader-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-bottom: 1px dashed #2a181030;
  }
  .leader-row:last-child { border-bottom: none; }
  .leader-row.you { background: #ffc94d44; border-radius: 12px; }

  .leader-rank {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 900;
    font-size: 28px;
    min-width: 36px;
    color: var(--ink);
  }
  .leader-row:nth-child(2) .leader-rank { color: var(--pink); font-size: 38px; }

  .leader-name {
    flex: 1;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 700;
  }
  .leader-medal { font-size: 24px; }

  .leader-score {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    background: var(--ink);
    color: var(--paper);
    padding: 4px 10px;
    border-radius: 6px;
  }

  .empty-leader {
    text-align: center;
    font-style: italic;
    opacity: 0.5;
    padding: 20px;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  @media (max-width: 560px) {
    .options-grid { grid-template-columns: 1fr; }
    .question-card { padding: 24px 20px; }
    .option-btn { padding: 18px 16px; font-size: 16px; min-height: 72px; }
  }
</style>
</head>

<div class="container">

  <div class="screen active start-screen" id="screen-start">
    <div class="eyebrow">Birthday Edition</div>
    <h1>who knows<br><span class="highlight">tate</span> <span class="highlight2">best?</span></h1>
    <div class="subtitle">~ a birthday quiz, take it & find out ~</div>

    <div class="name-card">
      <div class="name-label">Your Name</div>
      <input type="text" class="name-input-big" id="player-name" placeholder="enter your name..." maxlength="30">
      <button class="btn btn-big" id="start-btn" style="width: 100%;" onclick="startQuiz()">Start Quiz →</button>
    </div>
  </div>

  <div class="screen" id="screen-quiz">
    <div class="quiz-header">
      <div class="player-tag" id="quiz-player">~ player ~</div>
      <div class="progress-info" id="quiz-progress">Question 1 / 21</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>

    <div class="question-card">
      <div class="question-num" id="question-num">Question 1</div>

    </div>

    <div class="leaderboard">
      <div class="leaderboard-title">★ Leaderboard ★</div>
      <div class="leaderboard-sub">who knows tate best</div>
      <div id="leaderboard-list"></div>
    </div>

    <div class="actions">
      <button class="btn" onclick="playAgain()">Play Again</button>
      <button class="btn" onclick="clearLeaderboard()" style="background: transparent; color: var(--paper); border-color: var(--paper);">Clear Leaderboard</button>
    </div>
  </div>

</div>

<script>
  let currentQ = 0;
  let score = 0;
  let playerName = '';
  let answered = false;
  let leaderboard = [];

  document.getElementById('player-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') startQuiz();
  });

  function startQuiz() {
    const name = document.getElementById('player-name').value.trim();
    if (!name) {
      document.getElementById('player-name').focus();
      return;
    }
    playerName = name;
    currentQ = 0;
    score = 0;
    showScreen('quiz');
    document.getElementById('quiz-player').textContent = `~ ${playerName} ~`;
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = QUIZ[currentQ];
    const total = QUIZ.length;

    document.getElementById('quiz-progress').textContent = `Question ${currentQ + 1} / ${total}`;
    document.getElementById('progress-fill').style.width = `${((currentQ) / total) * 100}%`;
    document.getElementById('question-num').textContent = `Question ${currentQ + 1}`;
    document.getElementById('question-text').textContent = q.question;
    document.getElementById('feedback').innerHTML = '';

    const grid = document.getElementById('options-grid');
    grid.className = 'options-grid' + (q.type === 'tf' ? ' tf' : '');
    grid.innerHTML = '';

    if (q.type === 'tf') {
      ['TRUE', 'FALSE'].forEach((label, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.color = i === 0 ? 'd' : 'a';
        btn.dataset.index = i;
        btn.innerHTML = `<span>${label}</span>`;
        btn.onclick = () => selectAnswer(i);
        grid.appendChild(btn);
      });
    } else {
      const colors = ['a', 'b', 'c', 'd'];
      const icons = ['▲', '◆', '●', '■'];
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.color = colors[i];
        btn.dataset.index = i;
        btn.innerHTML = `<span class="icon">${icons[i]}</span><span>${escapeHtml(opt)}</span>`;
        btn.onclick = () => selectAnswer(i);
        grid.appendChild(btn);
      });
    }
  }

  function selectAnswer(idx) {
    if (answered) return;
    answered = true;
    const q = QUIZ[currentQ];
    const buttons = document.querySelectorAll('.option-btn');
    const isRight = idx === q.correct;

    if (isRight) score++;

    buttons.forEach(btn => {
      btn.disabled = true;
      const i = parseInt(btn.dataset.index);
      if (i === q.correct) btn.classList.add('correct');
      else if (i === idx) btn.classList.add('selected-wrong');
      else btn.classList.add('wrong');
    });

    const feedback = document.getElementById('feedback');
    feedback.innerHTML = `
      <div class="feedback-text ${isRight ? 'right' : 'wrong'}">
        ${isRight ? randomRightMsg() : randomWrongMsg()}
      </div>
      <button class="btn next-btn" onclick="nextQuestion()">
        ${currentQ === QUIZ.length - 1 ? 'See Results →' : 'Next →'}
      </button>
    `;

    document.getElementById('progress-fill').style.width = `${((currentQ + 1) / QUIZ.length) * 100}%`;
  }

  function randomRightMsg() {
    const msgs = ['nailed it! 🎯', 'correct! ✨', 'yes!! 💖', 'you got it! 🌟', 'spot on! 🔥'];
    return msgs[Math.floor(Math.random() * msgs.length)];
  }
  function randomWrongMsg() {
    const msgs = ['nope! 😅', 'so close! 💔', 'not quite!', 'oof, wrong one!', 'better luck next!'];
    return msgs[Math.floor(Math.random() * msgs.length)];
  }

  function nextQuestion() {
    currentQ++;
    if (currentQ >= QUIZ.length) {
      finishQuiz();
    } else {
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function finishQuiz() {
    leaderboard.push({ name: playerName, score: score });
    leaderboard.sort((a, b) => b.score - a.score);

    document.getElementById('final-score').textContent = score;
    document.querySelectorAll('.big-score .total').forEach(el => el.textContent = ` / ${QUIZ.length}`);
    document.getElementById('verdict').textContent = getVerdict(score, QUIZ.length);

    renderLeaderboard();
    showScreen('results');

    if (score >= QUIZ.length * 0.7) fireConfetti();
    if (leaderboard.length > 0 && leaderboard[0].name === playerName && leaderboard[0].score === score && score > 0) {
      setTimeout(fireConfetti, 200);
    }
  }

  function getVerdict(s, total) {
    const pct = s / total;
    if (pct === 1) return "perfect score — you ARE Tate 🏆";
    if (pct >= 0.85) return "you know Tate inside out 💖";
    if (pct >= 0.7) return "best friend material ✨";
    if (pct >= 0.5) return "decent effort, keep studying 📚";
    if (pct >= 0.3) return "you barely know her 😅";
    return "are you sure you know Tate? 💀";
  }

  function renderLeaderboard() {
    const lb = document.getElementById('leaderboard-list');
    if (leaderboard.length === 0) {
      lb.innerHTML = '<div class="empty-leader">no scores yet!</div>';
      return;
    }
    const topScore = leaderboard[0].score;
    const medals = ['🏆', '🥈', '🥉'];
    let marked = false;
    lb.innerHTML = leaderboard.map((p, i) => {
      const isYou = !marked && p.name === playerName && p.score === score;
      if (isYou) marked = true;
      const medal = p.score === topScore ? '🏆' : (medals[i] || '');
      return `
        <div class="leader-row${isYou ? ' you' : ''}">
          <span class="leader-rank">${i + 1}</span>
          <span class="leader-name">${escapeHtml(p.name)}${isYou ? ' (you)' : ''}</span>
          <span class="leader-medal">${medal}</span>
          <span class="leader-score">${p.score} / ${QUIZ.length}</span>
        </div>
      `;
    }).join('');
  }

  function clearLeaderboard() {
    if (!confirm('Clear all scores from the leaderboard?')) return;
    leaderboard = [];
    renderLeaderboard();
  }

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
  }

  function playAgain() {
    document.getElementById('player-name').value = '';
    showScreen('start');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(() => document.getElementById('player-name').focus(), 200);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Confetti
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let confettiPieces = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const cfColors = ['#ff4d8d', '#ffc94d', '#4dd4c4', '#a855f7', '#ff5757', '#fdf6e8'];
  const cfShapes = ['square', 'circle', 'triangle', 'star'];

  function fireConfetti() {
    const count = 180;
    for (let i = 0; i < count; i++) {
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.5,
        vx: (Math.random() - 0.5) * 6,
        vy: Math.random() * 4 + 3,
        size: Math.random() * 8 + 6,
        color: cfColors[Math.floor(Math.random() * cfColors.length)],
        shape: cfShapes[Math.floor(Math.random() * cfShapes.length)],
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.2,
        life: 1
      });
    }
    if (confettiPieces.length === count) animateConfetti();
  }

  function drawShape(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    switch (p.shape) {
      case 'square': ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); break;
      case 'circle': ctx.beginPath(); ctx.arc(0, 0, p.size/2, 0, Math.PI * 2); ctx.fill(); break;
      case 'triangle':
        ctx.beginPath();
        ctx.moveTo(0, -p.size/2); ctx.lineTo(p.size/2, p.size/2); ctx.lineTo(-p.size/2, p.size/2);
        ctx.closePath(); ctx.fill(); break;
      case 'star':
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
          const x = Math.cos(a) * p.size/2; const y = Math.sin(a) * p.size/2;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill(); break;
    }
    ctx.restore();
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiPieces = confettiPieces.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.99; p.rotation += p.rotationSpeed;
      if (p.y > canvas.height + 50) p.life -= 0.05;
      drawShape(p);
      return p.life > 0;
    });
    if (confettiPieces.length > 0) requestAnimationFrame(animateConfetti);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Set total score display
  document.querySelectorAll('.big-score .total').forEach(el => el.textContent = ` / ${QUIZ.length}`);
  document.getElementById('quiz-progress').textContent = `Question 1 / ${QUIZ.length}`;

  document.getElementById('player-name').focus();
</script>

</body>
</html>
